[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fixerupper"
version = "0.1.0"
description = "Windows Event Viewer crash analyzer with modern UI to diagnose and explain system issues."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
fixerupper = "fixerupper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fixerupper = ["static/*"]
